# Profilo device : Aldes InspirAIR Home SC150 (VMC doppio flusso)
id: inspirair-sc150
name: "InspirAIR Home SC150"
description: "VMC doppio flusso Aldes InspirAIR Home SC150"
type: vmc

products:
  INSPIRAIR_SC150:
    name: "InspirAIR® Home SC150"
    reference_fields: [outside_tpt, extf_flw, ffe_flw]

telemetry:
  modemid: product.modem
  productid: product.serial_number
  air_mode_field: current_mode

air_modes:
  - { index: 0, code: "V", label: "Quotidiano (V)" }
  - { index: 1, code: "X", label: "Modalità X" }
  - { index: 2, code: "Y", label: "Modalità Y" }
  - { index: 3, code: "W", label: "Vacanze (W)" }
  - { index: 4, code: "Z", label: "Programmazione (Z)" }

water_modes: []

history_labels:
  families:
    - name: "Temperature VMC"
      keys:
        - { key: outside_tpt, label: "Temperatura aria esterna (°C)" }
        - { key: ext_tpt, label: "Temperatura aria estratta (°C)" }
        - { key: reject_tpt, label: "Temperatura aria espulsa (°C)" }
    - name: "Ventilazione e Portate"
      keys:
        - { key: extf_flw, label: "Portata estrazione (m³/h)" }
        - { key: ffe_flw, label: "Portata insufflazione (m³/h)" }
        - { key: extf_spd, label: "Velocità ventola estrazione (rpm)" }
        - { key: vi_spd, label: "Velocità ventola insufflazione (rpm)" }
        - { key: set_spd, label: "Livello velocità impostato (1-3)" }
    - name: "Filtri e Bypass"
      keys:
        - { key: ff_cpt, label: "Contatore usura filtro" }
        - { key: dep_ind, label: "Indice depressione filtri" }
        - { key: dtb_ind, label: "Stato bypass" }
    - name: "Consumi e Qualità Aria"
      keys:
        - { key: echange_pwr, label: "Potenza scambiatore (W)" }
        - { key: cve_csn, label: "Consumo estrazione (W)" }
        - { key: vi_csn, label: "Consumo insufflazione (W)" }
        - { key: tte_csn, label: "Consumo totale (W)" }
        - { key: Co2_vmc, label: "CO2 (ppm)" }
        - { key: Pm25_Vmc, label: "PM2.5 (µg/m³)" }
        - { key: Voc_Vmc, label: "VOC" }

commands:
  - id: set_mode
    label: "Cambia modalità VMC"
    method: changeMode
    topic_pattern: "devices/{device_id}/messages/devicebound"
    params:
      - name: code
        type: enum
        options_from: air_modes

ui:
  quick_modes:
    - field: air_modes
      label: "Modalità VMC"
  show_thermostats: false
  show_vacations: false
  show_people: false
  show_hot_water: false

ha_discovery:
  mode_mapping:
    V: "on"
    W: "on"
    X: "on"
    Y: "on"
    Z: "on"