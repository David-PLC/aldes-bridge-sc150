---
name: Aldes Bridge SC150
version: "2.1.1"
slug: aldes-bridge
description: Bridge MQTT/TLS locale nativo per VMC Aldes InspirAIR Home SC150
url: https://github.com/David-PLC/aldes-bridge-sc150
