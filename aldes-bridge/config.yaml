map:
  - addon_config:rw
options:
  mqtt_port: 18883
  box_ip: ""
  language: "it"
  ha_mqtt_host: ""
  ha_mqtt_port: 1883
  ha_mqtt_user: ""
  ha_mqtt_password: ""
schema:
  mqtt_port: int
  box_ip: str
  language: str
  ha_mqtt_host: str
  ha_mqtt_port: int
  ha_mqtt_user: str
  ha_mqtt_password: password